<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">TPY<span>.</span></div>
</header>

<main>

    <section class="hero">
        <p class="mini">PRODUCTOS DIGITALES</p>

        <h1>
            Elegí lo que<br>
            <span>estás buscando.</span>
        </h1>
    </section>

    <section class="productos">

        <a href="https://go.hotmart.com/Y107501255H" class="producto producto-recetas" target="_blank" rel="noopener noreferrer">
            <div class="recetas-titulo">+200 recetas para tu bebé</div>
            <img class="producto-img" src="img/recetas-bebes.png" alt="Recetas para bebés">
            <div class="flecha">→</div>
        </a>
        
        <a href="https://go.hotmart.com/E107566284J" class="producto producto-recetas" target="_blank" rel="noopener noreferrer">
            <div class="recetas-titulo">+200 Recetas Saludables para Diabéticos</div>
            <div class="flecha">→</div>
        </a>

        <a href="https://go.hotmart.com/P107566430V?ap=402b" class="producto producto-recetas" style="transform:translateY(16px);" target="_blank" rel="noopener noreferrer">
            <div class="recetas-titulo">Full Repostería Desde Cero</div>

            <div style="display:flex; width:100%; height:123px; gap:8px; padding:4px 12px 8px; transform:translateY(-18px);">
                <img src="img/reposteria1.png" alt="Full Repostería Desde Cero" style="width:50%; height:100%; object-fit:contain; transform:translateX(-6px); transform:translateX(6px);">
                <img src="img/reposteria2.png" alt="Full Repostería Desde Cero" style="width:50%; height:100%; object-fit:contain;">
            </div>

            <div class="flecha">→</div>
        </a>

    </section>

</main>
