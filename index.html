<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">TPY<span>.</span></div>
</header>

<main>

    <section class="hero">
        <p class="mini">PRODUCTOS DIGITALES</p>

        <h1>
            Elegí lo que<br>
            <span>estás buscando.</span>
        </h1>
    </section>

    <section class="productos">

        <div class="producto-card">
            <div class="producto-foto">
                <img src="img/recetas-bebes.png" alt="Recetas para bebés">
            </div>
            <div class="producto-nombre">+200 recetas para tu bebé</div>
            <a href="https://go.hotmart.com/Y107501255H" class="producto-boton" target="_blank" rel="noopener noreferrer">
                Ver producto →
            </a>
        </div>

        <div class="producto-card">
            <div class="producto-foto producto-foto-vacio">
                <span>Foto del producto</span>
            </div>
            <div class="producto-nombre">+200 recetas saludables<br>para diabéticos</div>
            <a href="https://go.hotmart.com/E107566284J" class="producto-boton" target="_blank" rel="noopener noreferrer">
                Ver producto →
            </a>
        </div>

        <div class="producto-card">
            <div class="producto-foto">
                <img src="img/reposteria1.png" alt="Full Repostería Desde Cero">
            </div>
            <div class="producto-nombre">Full Repostería Desde Cero</div>
            <a href="https://go.hotmart.com/P107566430V?ap=402b" class="producto-boton" target="_blank" rel="noopener noreferrer">
                Ver producto →
            </a>
        </div>

    </section>

</main>
